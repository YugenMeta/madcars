<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Manila Auto Deal</title>
</head>
<body>
<script>
(function () {
  var allowed = /^(?:\/(?:cars|luxury|sold|archive|offers|sell|source|about|concierge|favorites)(?:\/[^/?#]+)?|\/vehicle\/[^/?#]+)\/?$/;
  var path = window.location.pathname;

  // Only recover routes that belong to the Manila Auto Deal SPA.
  // Unknown URLs remain a normal GitHub Pages 404 instead of entering a redirect loop.
  if (!allowed.test(path)) return;

  var requested = path + window.location.search + window.location.hash;
  try {
    sessionStorage.setItem("mad_requested_route", requested);
  } catch (e) {
    return;
  }

  window.location.replace(window.location.origin + "/");
})();
</script>
<noscript>Page not found.</noscript>
</body>
</html>
